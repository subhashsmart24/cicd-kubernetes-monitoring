apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-monitoring-app
  labels:
    app: cicd-monitoring-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cicd-monitoring-app
  template:
    metadata:
      labels:
        app: cicd-monitoring-app
    spec:
      containers:
        - name: flask-app
          image: 798306367943.dkr.ecr.ap-south-1.amazonaws.com/cicd-kubernetes-monitoring:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
