apiVersion: v1
kind: Service
metadata:
  name: cicd-monitoring-service
  labels:
    app: cicd-monitoring-app
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "5000"
spec:
  type: NodePort
  selector:
    app: cicd-monitoring-app
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      nodePort: 30080